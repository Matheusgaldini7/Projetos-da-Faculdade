<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de livro</title>
  <link rel="stylesheet" href="CadastrarLivro.css">
</head>
<body>

  <header>
    <img src="//upload.wikimedia.org/wikipedia/commons/thumb/3/31/Logo_PUC-Campinas.svg/750px-Logo_PUC-Campinas.svg.png" alt="Logo da Puc" class="logo">
    <hr>
  </header>

  <main>
    <section class="azul_cadastrar_livro">
      <h1>Cadastro de Livro</h1>
      <form class="form-cadastro-livro">

        <label for="codigo">Código:</label>
        <input type="text" id="codigo" name="codigo" placeholder="Ex: 12345">

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" placeholder="Título do livro">

        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" placeholder="Autor do livro">

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex: 10">

        <label for="categoria">Categoria:</label>
        <input type="text" id="categoria" name="categoria" placeholder="Ex: Ficção">

        <label for="editora">Editora:</label>
        <input type="text" id="editora" name="editora" placeholder="Ex: Companhia das Letras">

        <p id="mensagem"></p>

        <div class="botoes_cadastrar_livro">
          <a class="btnVermelho" href="index.html">Voltar</a>
          <button type="reset">Limpar</button>
          <button type="submit">Cadastrar</button> 
        </div>

      </form>
    </section>
  </main>

 
  <footer>
      <p>&copy; 2025 PUC-Campinas. Todos os direitos reservados.</p>
  </footer>

  <script src="./cadastroLivro.js"></script>
</body>
</html>
